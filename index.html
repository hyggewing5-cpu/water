<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ระบบบันทึกการใช้น้ำปะปา</title>
<!-- ถ้า JavaScript ไม่ทำงาน ให้เด้งไปหน้าจดมิเตอร์ -->
<meta http-equiv="refresh" content="1;url=https://script.google.com/macros/s/AKfycby5DuF-Jqc8sJfmD8TtNxq4i0vb0S50InbVdMZzruaShQYfl82HceATfwA2o132kNzXUg/exec">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F3F6F9;color:#0B2A4A;font-family:'Noto Sans Thai',system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  main{max-width:360px;width:100%}
  h1{font-size:22px;margin:12px 0 4px}
  p{margin:0 0 20px;color:#4A5F73;font-size:15px}
  a.btn{display:block;padding:15px;border-radius:14px;text-decoration:none;font-weight:600;font-size:17px;margin-top:10px}
  a.main{background:#0A5C99;color:#fff}
  a.sec{background:#fff;color:#0B2A4A;border:2px solid #0B2A4A}
</style>
</head>
<body>
<main>
  <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#0A5C99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>
  <h1>ระบบบันทึกการใช้น้ำปะปา</h1>
  <p>กำลังพาไปยังหน้าจดมิเตอร์...</p>
  <a class="btn main" id="rec" href="#">เปิดหน้าจดมิเตอร์</a>
  <a class="btn sec" id="adm" href="#">หลังบ้าน (ผู้ดูแลระบบ)</a>
</main>
<script>
  // เปลี่ยนลิงก์ปลายทางตรงนี้ถ้ามีการ Deploy ใหม่ (ลิงก์ /exec เปลี่ยน)
  var EXEC = 'https://script.google.com/macros/s/AKfycby5DuF-Jqc8sJfmD8TtNxq4i0vb0S50InbVdMZzruaShQYfl82HceATfwA2o132kNzXUg/exec';
  // ส่งต่อพารามิเตอร์ เช่น ?page=admin ไปยังระบบจริง
  var target = EXEC + (location.search || '');
  document.getElementById('rec').href = EXEC;
  document.getElementById('adm').href = EXEC + '?page=admin';
  setTimeout(function () { location.replace(target); }, 400);
</script>
</body>
</html>
